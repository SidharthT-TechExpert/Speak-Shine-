    <!-- Preconnect to external origins to reduce DNS/TLS latency -->

    <!-- Non-blocking font load -->

    <!-- Inline critical CSS -->
    <style>
      body { background: #05050f; color: #f0f0ff; margin: 0; }
      html[data-theme="light"] body { background: #f8fafc; color: #0f172a; }
      #root { min-height: 100vh; }
      /* Skeleton spinner shown before React mounts */
      .initial-loader {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; background: #05050f;
      }
      html[data-theme="light"] .initial-loader {
        background: #f8fafc;
      }
      .initial-loader::after {
        content: ""; width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid #1c1c3e; border-top-color: #8b5cf6;
        animation: spin 0.7s linear infinite;
      }
      html[data-theme="light"] .initial-loader::after {
        border-color: #e2e8f0; border-top-color: #7c3aed;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('speakshine-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="initial-loader"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
