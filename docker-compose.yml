services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: speak-shine-backend-v2:latest
    container_name: speak-shine-backend-v2
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/speak-shine
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/v1/docs-json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - speakshine-network

  mongodb:
    image: mongo:7
    container_name: speak-shine-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - speakshine-network

  redis:
    image: redis:7-alpine
    container_name: speak-shine-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - speakshine-network

  nginx:
    image: nginx:latest
    container_name: speak-shine-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - speakshine-network

volumes:
  mongodb_data:
  redis_data:

networks:
  speakshine-network:
    driver: bridge
